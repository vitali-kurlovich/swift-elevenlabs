    post:
      tags:
      - speech-to-text
      summary: Speech To Text
      description: Transcribe an audio or video file. If webhook is set to true, the request will be processed asynchronously
        and results sent to configured webhooks. When use_multi_channel is true and the provided audio has multiple channels,
        a 'transcripts' object with separate transcripts for each channel is returned; set multichannel_output_style='combined'
        to instead receive a single transcript with all channels merged and sorted by time. Otherwise, returns a single transcript.
        The optional webhook_metadata parameter allows you to attach custom data that will be included in webhook responses
        for request correlation and tracking.
      operationId: speech_to_text
