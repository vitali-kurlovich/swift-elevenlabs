          title: Force Instrumental
          description: If true, guarantees that the generated song will be instrumental. If false, the song may or may not
            be instrumental depending on the `prompt`. Can only be used with `prompt`.
          default: false
        finetune_id:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Finetune Id
          description: The ID of the finetune to use for the generation
        finetune_strength:
          type: number
          maximum: 2.0
          exclusiveMinimum: 0.0
          title: Finetune Strength
          description: How strongly the finetune influences the generation. Defaults to 1.0 (full strength). Lower values
            soften the influence of the finetune, leaving more room for prompt-level steering. Only meaningful when `finetune_id`
            is also provided.
          default: 1.0
          x-fern-ignore: true
        use_phonetic_names:
          type: boolean
          title: Use Phonetic Names
          description: If true, proper names in the prompt will be phonetically spelled in the lyrics for better pronunciation
            by the music model. The original names will be restored in word timestamps.
          default: false
          x-fern-ignore: true
        respect_sections_durations:
          type: boolean
          title: Respect Sections Durations
          description: Controls how strictly section durations in the `composition_plan` are enforced. Only used with `composition_plan`
            and only applies to `music_v1`; for `music_v2` and `music_v2_5` section durations are always enforced and this
            is ignored. When false for `music_v1`, the model may adjust individual section durations for better quality and
            latency, while preserving the total song duration from the plan.
          default: true
        store_for_inpainting:
          type: boolean
          title: Store For Inpainting
          description: Whether to store the generated song for inpainting.
          default: false
        sign_with_c2pa:
          type: boolean
          title: Sign With C2Pa
          description: Whether to sign the generated song with C2PA. Applicable only for mp3 files.
          default: false
      type: object
      title: Body_Compose_music_v1_music_post
