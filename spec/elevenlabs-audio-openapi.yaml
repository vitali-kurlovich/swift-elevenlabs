          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Similarity Boost
          description: Determines how closely the AI should adhere to the original voice when attempting to replicate it.
          default: 0.75
        style:
          anyOf:
          - type: number
          - type: 'null'
          title: Style
          description: Determines the style exaggeration of the voice. This setting attempts to amplify the style of the original
            speaker. It does consume additional computational resources and might increase latency if set to anything other
            than 0.
          default: 0.0
        speed:
          anyOf:
          - type: number
          - type: 'null'
          title: Speed
          description: Adjusts the speed of the voice. A value of 1.0 is the default speed, while values less than 1.0 slow
            down the speech, and values greater than 1.0 speed it up.
          default: 1.0
        clone_strength:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Clone Strength
          description: Controls how closely the voice matches the professional voice clone samples, from 0 (low) to 1 (high).
            We recommend 0 for most use cases. Increase this value only if you experience issues with the default settings.
            Only applies to professional voice clones fine-tuned for the selected v4 model.
