          description: The channel index this transcript belongs to (for multichannel audio).
        additional_formats:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/AdditionalFormatResponseModel'
              - type: 'null'
            type: array
          - type: 'null'
          title: Additional Formats
          description: Requested additional formats of the transcript.
        transcription_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcription Id
          description: The transcription ID of the response.
        entities:
          anyOf:
          - items:
              $ref: '#/components/schemas/DetectedEntity'
            type: array
          - type: 'null'
          title: Entities
          description: List of detected entities with their text, type, and character positions in the transcript.
        audio_duration_secs:
          anyOf:
          - type: number
          - type: 'null'
          title: Audio Duration Secs
          description: The duration of the audio that was transcribed in seconds.
        edited_transcript:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/EditedTranscript'
            - $ref: '#/components/schemas/TranscriptEditError'
            discriminator:
              propertyName: kind
              mapping:
                error: '#/components/schemas/TranscriptEditError'
                transcript: '#/components/schemas/EditedTranscript'
          - type: 'null'
          title: Edited Transcript
          description: 'Result of the optional transcript edit: the edited text, or an error if it could not be produced.
            Absent when no edit was requested. On success, both `text` and `edited_text` hold the edited transcript; compare
            them with the top-level `text` to see what changed.'
      type: object
      required:
      - language_code
      - language_probability
      - text
      - words
      title: SpeechToTextChunkResponseModel
      description: Chunk-level detail of the transcription with timing information.
      example:
        language_code: en
        language_probability: 0.98
        text: Hello world!
        words:
        - end: 0.5
          logprob: -0.124
          speaker_id: speaker_1
          start: 0.0
          text: Hello
          type: word
        - end: 0.5
          logprob: 0.0
          speaker_id: speaker_1
          start: 0.5
          text: ' '
          type: spacing
        - end: 1.2
          logprob: -0.089
          speaker_id: speaker_1
          start: 0.5
          text: world!
          type: word
