      properties:
        stability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Stability
          description: Determines how stable the voice is and the randomness between each generation. Lower values introduce
            broader emotional range for the voice. Higher values can result in a monotonous voice with limited emotion.
          default: 0.5
        similarity:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Similarity
          description: Determines how strongly the model is guided while generating. Higher values make the model adhere more
            closely to the voice, at the cost of variation. Not supported by every model.
          default: 0.75
        clone_strength:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Clone Strength
          description: Controls how closely the voice matches the professional voice clone samples, from 0 (low) to 1 (high).
            We recommend 0 for most use cases. Increase this value only if you experience issues with the default settings.
            Only applies to professional voice clones fine-tuned for the selected v4 model.
      type: object
      title: ToDialogueSettingsResponseModel
      example:
        stability: 0.5
