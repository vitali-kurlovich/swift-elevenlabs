    Body_Speech_to_Text_v1_speech_to_text_post:
      properties:
        model_id:
          type: string
          title: Model Id
          description: The ID of the model to use for transcription.
          examples:
          - scribe_v2
          - scribe_v2_medical
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
          description: The file to transcribe (100ms minimum audio length). All major audio and video formats are supported.
            Exactly one of the file or cloud_storage_url parameters must be provided. The file size must be less than 5.0GB.
        language_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Language Code
          description: An ISO-639-1 or ISO-639-3 language_code corresponding to the language of the audio file. Can sometimes
            improve transcription performance if known beforehand. Defaults to null, in this case the language is predicted
            automatically.
        transcript_edit:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcript Edit
          description: Natural-language instruction applied to the final transcript (max 2000 characters). The edited text
            is returned in 'edited_transcript' alongside the original transcript. Cannot be combined with entity_detection,
            entity_redaction or use_multi_channel. Usage of this parameter will incur an additional 30% surcharge on the base
            transcription cost, billed for at least 10 seconds of audio.
        tag_audio_events:
          type: boolean
          title: Tag Audio Events
          description: Whether to tag audio events like (laughter), (footsteps), etc. in the transcription.
          default: true
        num_speakers:
          anyOf:
          - type: integer
            maximum: 32.0
            minimum: 1.0
          - type: 'null'
          title: Num Speakers
          description: The maximum amount of speakers talking in the uploaded file. Can help with predicting who speaks when.
            The maximum amount of speakers that can be predicted is 32. Defaults to null, in this case the amount of speakers
            is set to the maximum value the model supports.
        timestamps_granularity:
          type: string
          enum:
          - none
          - word
          - character
          title: Timestamps Granularity
          description: The granularity of the timestamps in the transcription. 'word' provides word-level timestamps and 'character'
            provides character-level timestamps per word.
          default: word
        diarize:
          type: boolean
          title: Diarize
          description: Whether to annotate which speaker is currently talking in the uploaded file.
          default: false
        diarization_threshold:
          anyOf:
          - type: number
            maximum: 0.4
            minimum: 0.1
          - type: 'null'
          title: Diarization Threshold
          description: Diarization threshold to apply during speaker diarization. A higher value means there will be a lower
            chance of one speaker being diarized as two different speakers but also a higher chance of two different speakers
            being diarized as one speaker (less total speakers predicted). A low value means there will be a higher chance
            of one speaker being diarized as two different speakers but also a lower chance of two different speakers being
            diarized as one speaker (more total speakers predicted). Can only be set when diarize=True and num_speakers=None.
            Defaults to None, in which case we will choose a threshold based on the model_id (0.22 usually).
        additional_formats:
          $ref: '#/components/schemas/AdditionalFormats'
          description: A list of additional formats to export the transcript to.
          examples:
          - - format: srt
              include_speakers: true
              include_timestamps: true
            - format: txt
              include_speakers: false
        file_format:
          type: string
          enum:
          - pcm_s16le_16
          - other
          title: File Format
          description: The format of input audio. Options are 'pcm_s16le_16' or 'other' For `pcm_s16le_16`, the input audio
            must be 16-bit PCM at a 16kHz sample rate, single channel (mono), and little-endian byte order. Latency will be
            lower than with passing an encoded waveform.
          default: other
          examples:
          - pcm_s16le_16
          - other
        cloud_storage_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Cloud Storage Url
          description: '[Deprecated] This parameter is deprecated and will be removed in the future. Use ''source_url'' instead.The
            HTTPS URL of the file to transcribe. Exactly one of the file or cloud_storage_url parameters must be provided.
            The file must be accessible via HTTPS and the file size must be less than 2GB. Any valid HTTPS URL is accepted,
            including URLs from cloud storage providers (AWS S3, Google Cloud Storage, Cloudflare R2, etc.), CDNs, or any
            other HTTPS source. URLs can be pre-signed or include authentication tokens in query parameters.'
          deprecated: true
          examples:
          - https://storage.googleapis.com/my-bucket/folder/audio.mp3
          - https://my-bucket.s3.us-west-2.amazonaws.com/folder/audio.mp3
          - https://account123.r2.cloudflarestorage.com/my-bucket/audio.mp3
          - https://cdn.example.com/media/audio.wav
          x-fern-ignore: true
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
          description: The URL of an audio or video file to transcribe. Supports hosted video or audio files, YouTube video
            URLs, TikTok video URLs, and other video hosting services.
          examples:
          - https://storage.googleapis.com/my-bucket/folder/audio.mp3
          - https://www.youtube.com/watch?v=dQw4w9WgXcQ
          - https://www.tiktok.com/@barstoolsports/video/7285745795779939614
        webhook:
          type: boolean
          title: Webhook
          description: Whether to send the transcription result to configured speech-to-text webhooks.  If set the request
            will return early without the transcription, which will be delivered later via webhook.
          default: false
        webhook_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Id
          description: Optional specific webhook ID to send the transcription result to. Only valid when webhook is set to
            true. If not provided, transcription will be sent to all configured speech-to-text webhooks.
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
          description: Controls the randomness of the transcription output. Accepts values between 0.0 and 2.0, where higher
            values result in more diverse and less deterministic results. If omitted, we will use a temperature based on the
            model you selected which is usually 0.
        seed:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 0.0
          - type: 'null'
          title: Seed
          description: If specified, our system will make a best effort to sample deterministically, such that repeated requests
            with the same seed and parameters should return the same result. Determinism is not guaranteed. Must be an integer
            between 0 and 2147483647.
          examples:
          - 12345
        use_multi_channel:
          type: boolean
          title: Use Multi Channel
          description: Whether the audio file contains multiple channels where each channel contains a single speaker. When
            enabled, each channel is transcribed independently. By default a separate transcript is returned per channel;
            set multichannel_output_style='combined' to instead receive a single transcript with all channels merged and sorted
            by time. Each word in the response includes a 'channel_index' field indicating which channel it was spoken on.
            A maximum of 5 channels is supported. Each channel is billed independently at the full audio duration, so cost
            scales linearly with the number of channels.
          default: false
        multichannel_output_style:
          type: string
          enum:
          - separate
          - combined
          title: Multichannel Output Style
          description: Controls the response shape when use_multi_channel is enabled. 'separate' (default) returns one transcript
            per channel under 'transcripts'. 'combined' merges all channels into a single transcript whose words are sorted
            by start time, each carrying a 'channel_index' - matching the single-channel response shape. 'combined' requires
            timestamps (timestamps_granularity must not be 'none') and does not support entity detection or redaction.
          default: separate
        webhook_metadata:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Webhook Metadata
          description: Optional metadata to be included in the webhook response. This should be a JSON string representing
            an object with a maximum depth of 2 levels and maximum size of 16KB. Useful for tracking internal IDs, job references,
            or other contextual information.
          examples:
          - '{"user_id": "123", "session_id": "abc-def-ghi"}'
          - '{"request_type": "interview", "participant_name": "John Doe"}'
        entity_detection:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Entity Detection
          description: Detect entities in the transcript. Can be 'all' to detect all entities, a single entity type or category
            string, or a list of entity types/categories. Categories include 'pii', 'phi', 'pci', 'other', 'offensive_language'.
            When enabled, detected entities will be returned in the 'entities' field with their text, type, and character
            positions.
        no_verbatim:
          type: boolean
          title: No Verbatim
          description: If true, the transcription will not have any filler words, false starts and non-speech sounds. Only
            supported with scribe_v2 model.
          default: false
        use_speaker_library:
          type: boolean
          title: Use Speaker Library
          description: Whether to use the speaker library for identifying known speakers during diarization. When enabled
            and diarize is true, detected speakers will be matched against registered speakers in the workspace's speaker
            library.
          default: false
        detect_speaker_roles:
          type: boolean
          title: Detect Speaker Roles
          description: Whether to detect speaker roles (agent vs customer). Requires diarize=true. Cannot be used with use_multi_channel=true.
            When enabled, speaker_id values will be 'agent' and 'customer' instead of 'speaker_0', 'speaker_1', etc. Usage
            incurs an additional 10% surcharge on base transcription cost.
          default: false
        entity_redaction:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Entity Redaction
          description: 'Redact entities from the transcript text. Accepts the same format as entity_detection: ''all'', a
            category (''pii'', ''phi''), or specific entity types. Must be a subset of entity_detection. When redaction is
            enabled, the entities field will not be returned.'
        entity_redaction_mode:
          type: string
          title: Entity Redaction Mode
          description: How to format redacted entities. 'redacted' replaces with {REDACTED}, 'entity_type' replaces with {ENTITY_TYPE},
            'enumerated_entity_type' replaces with {ENTITY_TYPE_N} where N enumerates each occurrence. Only used when entity_redaction
            is set.
          default: enumerated_entity_type
        keyterms:
          items:
            type: string
          type: array
          title: Keyterms
          description: 'A list of keyterms to bias the transcription towards.           The keyterms are words or phrases
            you want the model to recognise more accurately.           The number of keyterms cannot exceed 1000.           The
            length of each keyterm must be less than 50 characters.           Keyterms can contain at most 5 words (after
            normalisation).           For example ["hello", "world", "technical term"].           The following characters
            are not supported: `<`, `>`, `{`, `}`, `[`, `]`, `\`.           Usage of this parameter will incur an additional
            20% surcharge on the base transcription cost.           When more than 100 keyterms are provided, a minimum billable
            duration of 20 seconds applies per request.'
          default: []
      type: object
      required:
      - model_id
      title: Body_Speech_to_Text_v1_speech_to_text_post
    Body_Stem_separation_v1_music_stem_separation_post:
      properties:
        file:
          type: string
          title: File
          description: The audio file to separate into stems.
          format: binary
        stem_variation_id:
          type: string
          enum:
          - two_stems_v1
          - six_stems_v1
          title: Stem Variation Id
          description: The id of the stem variation to use.
          default: six_stems_v1
        sign_with_c2pa:
          type: boolean
          title: Sign With C2Pa
          description: Whether to sign the generated song with C2PA. Applicable only for mp3 files.
          default: false
      type: object
      required:
      - file
      title: Body_Stem_separation_v1_music_stem_separation_post
    Body_Stream_composed_music_v1_music_stream_post:
      properties:
        prompt:
          anyOf:
          - type: string
            maxLength: 4100
          - type: 'null'
          title: Prompt
          description: A simple text prompt to generate a song from. Cannot be used in conjunction with `composition_plan`.
        generation_mode:
          anyOf:
          - $ref: '#/components/schemas/MusicGenerationMode'
          - type: 'null'
          description: Optional generation mode hint for prompt-based music generation. Can only be used with `prompt`.
          x-fern-ignore: true
        music_prompt:
          anyOf:
          - $ref: '#/components/schemas/MusicPrompt'
          - type: 'null'
          description: A music prompt. Deprecated. Use `composition_plan` instead.
          deprecated: true
          x-fern-ignore: true
        lyrics_text:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Lyrics Text
          description: The lyrics text to use for the generation.
          x-fern-ignore: true
        composition_plan:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/MusicPrompt'
            - $ref: '#/components/schemas/CompositionPlan'
          - type: 'null'
          title: Composition Plan
          description: A detailed composition plan to guide music generation. Cannot be used in conjunction with `prompt`.
        music_length_ms:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 3000.0
          - type: 'null'
          title: Music Length Ms
          description: The length of the song to generate in milliseconds. Used only in conjunction with `prompt`. Must be
            between 3000ms and 600000ms. Optional - if not provided, the model will choose a length based on the prompt.
        model_id:
          $ref: '#/components/schemas/MusicModelID'
          description: The model to use for the generation.
          default: music_v1
        seed:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 0.0
          - type: 'null'
          title: Seed
          description: Random seed to initialize the music generation process. Providing the same seed with the same parameters
            can help achieve more consistent results, but exact reproducibility is not guaranteed and outputs may change across
            system updates. Cannot be used in conjunction with prompt.
        force_instrumental:
          type: boolean
          title: Force Instrumental
