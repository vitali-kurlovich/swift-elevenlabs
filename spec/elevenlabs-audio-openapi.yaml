openapi: 3.1.0
info:
  title: ElevenLabs Audio API (subset)
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically,
    this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: text-to-speech
  description: Convert text into lifelike speech using a voice of your choice.
- name: voice-changer
  description: Transform audio from one voice to another, keeping its emotion, timing and delivery.
- name: speech-to-text
  description: Transcribe your audio files with detailed speaker annotations and precise timestamps using our cutting-edge
    model.
- name: forced-alignment
  description: Force align an audio file to a text transcript to get precise word-level and character level timing information.
    Response is a list of characters with their start and end times as milliseconds elapsed from the start of the recording.
- name: models
  description: Access the different models of the platform.
- name: voices
  description: Access to voices created either by you or ElevenLabs.
- name: samples
  description: Access to your samples. A sample is any audio file you attached to a voice. A voice can have one or more samples.
- name: speech-history
  description: Accesses your speech history. Your speech history is a list of all your created audio including its metadata
    using our text-to-speech and speech-to-speech models.
- name: text-to-dialogue
  description: Generate multi-speaker dialogue from a script using different voices.
- name: sound-generation
  description: Generate sound effects and non-speech audio from a text prompt.
- name: audio-isolation
  description: Isolate speech from background noise in an audio file.
- name: music-generation
  description: Generate music from a text prompt.
- name: music-finetunes
  description: Create and manage music finetunes.
- name: video-to-music
  description: Generate music that matches the content and mood of a video.
- name: pvc-voices
  description: Create and manage Professional Voice Clones (PVCs).
- name: Single Use Token
  description: Mint short-lived, single-use tokens for client-side use of Conversational AI agents.
paths:
  /v1/history:
    get:
      tags:
      - speech-history
      summary: List Generated Items
      description: Returns a list of your generated audio (e.g. text to speech, speech to speech, Studio, dubbing). Music
        and SFX generations are not included and cannot currently be retrieved via the API.
      operationId: get_speech_history
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: How many history items to return at maximum. Can not exceed 1000, defaults to 100.
          default: 100
          title: Page Size
        description: How many history items to return at maximum. Can not exceed 1000, defaults to 100.
      - name: start_after_history_item_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: After which ID to start fetching, use this parameter to paginate across a large collection of history
            items. In case this parameter is not provided history items will be fetched starting from the most recently created
            one ordered descending by their creation date.
          title: Start After History Item Id
        description: After which ID to start fetching, use this parameter to paginate across a large collection of history
          items. In case this parameter is not provided history items will be fetched starting from the most recently created
          one ordered descending by their creation date.
      - name: voice_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Voice ID to be filtered for, you can use GET https://api.elevenlabs.io/v1/voices to receive a list
            of voices and their IDs.
          title: Voice Id
        description: Voice ID to be filtered for, you can use GET https://api.elevenlabs.io/v1/voices to receive a list of
          voices and their IDs.
      - name: model_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Model ID to filter history items by.
          examples:
          - eleven_turbo_v2
          - eleven_multilingual_v2
          title: Model Id
        description: Model ID to filter history items by.
      - name: date_before_unix
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Unix timestamp to filter history items before this date (exclusive).
          examples:
          - 1640995200
          title: Date Before Unix
        description: Unix timestamp to filter history items before this date (exclusive).
      - name: date_after_unix
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Unix timestamp to filter history items after this date (inclusive).
          examples:
          - 1640995200
          title: Date After Unix
        description: Unix timestamp to filter history items after this date (inclusive).
      - name: sort_direction
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - asc
            - desc
            type: string
          - type: 'null'
          description: Sort direction for the results.
          examples:
          - desc
          - asc
          default: desc
          title: Sort Direction
        description: Sort direction for the results.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: search term used for filtering
          examples:
          - In the land far far away
          title: Search
        description: search term used for filtering
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - TTS
            - STS
            - Flows
            type: string
          - type: 'null'
          description: Source of the generated history item
          examples:
          - TTS
          title: Source
        description: Source of the generated history item
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpeechHistoryResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: list
  /v1/history/{history_item_id}:
    get:
      tags:
      - speech-history
      summary: Get History Item
      description: Retrieves a history item.
      operationId: get_speech_history_item_by_id
      parameters:
      - name: history_item_id
        in: path
        required: true
        schema:
          type: string
          description: History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list
            of history items and their IDs.
          examples:
          - VW7YKqPnjY4h39yTbx2L
          title: History Item Id
        description: History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of
          history items and their IDs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechHistoryItemResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: get
    delete:
      tags:
      - speech-history
      summary: Delete History Item
      description: Delete a history item by its ID
      operationId: delete_speech_history_item
      parameters:
      - name: history_item_id
        in: path
        required: true
        schema:
          type: string
          description: History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list
            of history items and their IDs.
          examples:
          - VW7YKqPnjY4h39yTbx2L
          title: History Item Id
        description: History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of
          history items and their IDs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteHistoryItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: delete
  /v1/history/{history_item_id}/audio:
    get:
      tags:
      - speech-history
      summary: Get Audio From History Item
      description: Returns the audio of an history item.
      operationId: get_audio_full_from_speech_history_item
      parameters:
      - name: history_item_id
        in: path
        required: true
        schema:
          type: string
          description: History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list
            of history items and their IDs.
          examples:
          - VW7YKqPnjY4h39yTbx2L
          title: History Item Id
        description: History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of
          history items and their IDs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: The audio file of the history item.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: get_audio
  /v1/history/download:
    post:
      tags:
      - speech-history
      summary: Download History Items
      description: Download one or more history items. If one history item ID is provided, we will return a single audio file.
        If more than one history item IDs are provided, we will provide the history items packed into a .zip file.
      operationId: download_speech_history_items
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Download_history_items_v1_history_download_post'
      responses:
        '200':
          description: The requested audio file, or a zip file containing multiple audio files when multiple history items
            are requested.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: invalid_output_format
                message: output_format must be wav or none
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: download
  /v1/sound-generation:
    post:
      tags:
      - sound-generation
      summary: Sound Generation
      description: Turn text into sound effects for your videos, voice-overs or video games using the most advanced sound
        effects models in the world.
      operationId: sound_generation
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/NonStreamingOutputFormats'
          - $ref: '#/components/schemas/AllowedOutputFormats'
          title: Output format of the generated audio.
          description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz
            sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to
            Creator tier or above. PCM and WAV formats with 44.1kHz sample rate requires you to be subscribed to Pro tier
            or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used
            for Twilio audio inputs.
          enum:
          - alaw_8000
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_128
          - mp3_44100_192
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - opus_48000_128
          - opus_48000_192
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - pcm_8000
          - ulaw_8000
          - wav_16000
          - wav_22050
          - wav_24000
          - wav_32000
          - wav_44100
          - wav_48000
          - wav_8000
          default: mp3_44100_128
        description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz
          sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator
          tier or above. PCM and WAV formats with 44.1kHz sample rate requires you to be subscribed to Pro tier or above.
          Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio
          inputs.
      - name: enable_logging
        in: query
        required: false
        schema:
          type: boolean
          title: Enable request logging.
          description: When enable_logging is set to false zero retention mode will be used for the request. Zero retention
            mode may only be used by enterprise customers.
          default: true
        description: When enable_logging is set to false zero retention mode will be used for the request. Zero retention
          mode may only be used by enterprise customers.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Sound_Generation_v1_sound_generation_post'
      responses:
        '200':
          description: The generated sound effect audio, encoded in the specified `output_format`.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
          headers:
            character-cost:
              description: The number of characters used for billing
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_sound_effects
      x-fern-sdk-method-name: convert
  /v1/audio-isolation:
    post:
      tags:
      - audio-isolation
      summary: Audio Isolation
      description: Removes background noise from audio
      operationId: audio_isolation
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Audio_Isolation_v1_audio_isolation_post'
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: convert
  /v1/audio-isolation/history:
    get:
      tags:
      - audio-isolation
      summary: Get Audio Isolation History
      description: Returns a list of all your audio isolation generations.
      operationId: get_audio_isolation_history
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: How many history items to return at maximum. Defaults to 100.
          default: 100
          title: Page Size
        description: How many history items to return at maximum. Defaults to 100.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for search pagination (1-based). Only used when search is provided.
          default: 1
          title: Page
        description: Page number for search pagination (1-based). Only used when search is provided.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional search term used for filtering audio isolation history (title/text).
          examples:
          - podcast
          - lecture
          title: Search
        description: Optional search term used for filtering audio isolation history (title/text).
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAudioIsolationHistoryResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: list
  /v1/audio-isolation/history/{history_item_id}:
    delete:
      tags:
      - audio-isolation
      summary: Delete Audio Isolation History Item
      description: Deletes a specific audio isolation history item and the associated media files.
      operationId: delete_audio_isolation_history_item
      parameters:
      - name: history_item_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the audio isolation history item.
          title: History Item Id
        description: Identifier of the audio isolation history item.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: delete
  /v1/audio-isolation/stream:
    post:
      tags:
      - audio-isolation
      summary: Audio Isolation Stream
      description: Removes background noise from audio and streams the result
      operationId: audio_isolation_stream
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Audio_Isolation_Stream_v1_audio_isolation_stream_post'
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: stream
      x-fern-streaming: true
  /v1/voices/{voice_id}/samples/{sample_id}:
    delete:
      tags:
      - samples
      summary: Delete Sample
      description: Removes a sample by its ID.
      operationId: delete_sample
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: sample_id
        in: path
        required: true
        schema:
          type: string
          description: Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the
            available samples for a voice.
          examples:
          - VW7YKqPnjY4h39yTbx2L
          title: Sample Id
        description: Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the
          available samples for a voice.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSampleResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: samples
      x-fern-sdk-method-name: delete
  /v1/voices/{voice_id}/samples/{sample_id}/audio:
    get:
      tags:
      - samples
      summary: Get Audio From Sample
      description: Returns the audio corresponding to a sample attached to a voice.
      operationId: get_audio_from_sample
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: sample_id
        in: path
        required: true
        schema:
          type: string
          description: Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the
            available samples for a voice.
          examples:
