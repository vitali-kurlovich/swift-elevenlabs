          type: number
          title: Language Probability
          description: The confidence score of the language detection (0 to 1).
        text:
          type: string
          title: Text
          description: The raw text of the transcription.
        words:
          items:
            $ref: '#/components/schemas/SpeechToTextWordResponseModel'
