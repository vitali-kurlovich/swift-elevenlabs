    EffectsSpec-Input:
      properties:
        filter_preset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter Preset Id
          description: ID of a filter preset that colors the voice, such as `phone` or `old_radio`. List valid IDs with `GET
            /v1/audio-effects/catalog`.
        distance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Distance
          description: How far the speaker sounds from the microphone, from 0 (close, unchanged) to 1 (far). Higher values
            roll off low and high frequencies and, when an environment is set, shift the balance from the dry voice toward
            the reverb.
          default: 0.0
        environment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment Id
          description: ID of a reverb environment that places the voice in a space, such as `small_room` or `hall`. List valid
            IDs with `GET /v1/audio-effects/catalog`. Reverb is rendered in stereo and adds a tail of up to several seconds
            after the speech ends.
        background_noise_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Background Noise Id
          description: ID of a background noise bed looped under the voice, such as `cafe` or `keyboard`. List valid IDs with
            `GET /v1/audio-effects/catalog`.
        send_level:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Send Level
          description: How much of the voice feeds the reverb, from 0 (none) to 1 (full). Only applies when `environment_id`
            is set; 0 turns the reverb off.
          default: 1.0
        pan:
          type: number
          maximum: 1.0
          minimum: -1.0
          title: Pan
          description: Stereo position of the voice, from -1 (hard left) through 0 (center) to 1 (hard right). Only the voice
            is panned; reverb and background noise stay centered.
          default: 0.0
      type: object
      title: EffectsSpec
      description: |-
        Audio effects applied to generated speech: a filter preset, perceived distance, a reverb
        environment, a background noise bed, and stereo panning. Leave every field at its default
        to get unprocessed audio.
