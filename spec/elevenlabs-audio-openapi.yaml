    GenerationChunk-Input:
      properties:
        text:
          type: string
          maxLength: 6132
          title: Text
          description: The text config to be generated for this chunk. Can contain an optional section name in square brackets
            at the beginning, e.g. [Verse 1], lyrics lines, and inline directions in curly braces, e.g. {scratching}. Section
            names must be between 1 and 100 characters. At most 30 lines are allowed, each at most 200 characters.
        duration_ms:
          type: integer
          maximum: 120000.0
          minimum: 3000.0
          title: Duration Ms
          description: The duration of the chunk in milliseconds. Must be between 3000ms and 120000ms.
        positive_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Positive Styles
          description: The styles and musical directions that should be present in this chunk. Use English language for best
            results. The styles for the first chunk are the most important as they set the overall tone and genre. Styles
            for subsequent chunks can be used to add nuance, progression, emphasis, or change the direction of the song. Aim
            to have at least 6-7 styles in early chunks until the direction is established. Generic styles like 'great production
            quality' are good default styles to append to the list.
        negative_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Negative Styles
          description: The styles and musical directions that should not be present in this chunk. Use English language for
            best results. Leaving empty is a good default, only use this field if you want to explicitly avoid a particular
            style or direction.
        context_adherence:
          type: string
          enum:
          - low
          - medium
          - high
          title: Context Adherence
          description: How much the model adheres to the context of its surrounding chunks. Low adherence means the model
            can deviate from the context and be more creative. High adherence means the model will be more consistent with
            the context.
          default: high
        conditioning_ref:
          anyOf:
          - $ref: '#/components/schemas/AudioRefChunk'
          - type: 'null'
          description: The audio reference to condition the generation on. The first chunk is the most important as it will
            influence the generation of all subsequent chunks. Thus, if you want to apply conditioning to the entire song,
            start conditioning from the first chunk.
        condition_strength:
          anyOf:
          - $ref: '#/components/schemas/ConditionStrength'
          - type: 'null'
          description: How strongly the model adheres to the conditioning reference. Low strength means the model will be
            more creative and deviate from the reference. High strength means the model will be more consistent with the reference.
      type: object
      required:
      - text
      - duration_ms
      - positive_styles
      title: GenerationChunk
