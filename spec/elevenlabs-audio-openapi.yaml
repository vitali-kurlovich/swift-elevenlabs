        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: A single-use authentication token created via POST /v1/single-use-token/batch_scribe. This token can
            only be used once and expires after 15 minutes. Alternative to API key or bearer token authentication for frontend
            clients.
          title: Token
        description: A single-use authentication token created via POST /v1/single-use-token/batch_scribe. This token can
          only be used once and expires after 15 minutes. Alternative to API key or bearer token authentication for frontend
          clients.
      - name: enable_logging
        in: query
        required: false
        schema:
          type: boolean
          title: Enable request logging.
          description: When enable_logging is set to false zero retention mode will be used for the request. This will mean
            log and transcript storage features are unavailable for this request. Zero retention mode may only be used by
            enterprise customers.
          default: true
        description: When enable_logging is set to false zero retention mode will be used for the request. This will mean
          log and transcript storage features are unavailable for this request. Zero retention mode may only be used by enterprise
          customers.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
            xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your
          xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Speech_to_Text_v1_speech_to_text_post'
      responses:
        '200':
          description: Synchronous transcription result
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SpeechToTextChunkResponseModel'
                - $ref: '#/components/schemas/MultichannelSpeechToTextResponseModel'
                - $ref: '#/components/schemas/SpeechToTextWebhookResponseModel'
                title: Response Speech To Text V1 Speech To Text Post
                oneOf:
                - $ref: '#/components/schemas/SpeechToTextChunkResponseModel'
                - $ref: '#/components/schemas/MultichannelSpeechToTextResponseModel'
              examples:
                single_channel:
                  summary: Single channel response
                  value:
                    language_code: en
                    language_probability: 0.98
                    text: Hello world!
                    words:
                    - text: Hello
                      start: 0.0
                      end: 0.5
                      type: word
                      speaker_id: speaker_1
                      logprob: -0.124
                multichannel:
                  summary: Multichannel response
                  value:
                    transcripts:
                    - language_code: en
                      language_probability: 0.98
                      text: Hello from channel one.
                      words:
                      - text: Hello
                        start: 0.0
                        end: 0.5
                        type: word
                        speaker_id: speaker_0
                        channel_index: 0
                        logprob: -0.124
                    - language_code: en
                      language_probability: 0.97
                      text: Greetings from channel two.
                      words:
                      - text: Greetings
                        start: 0.1
                        end: 0.7
                        type: word
                        speaker_id: speaker_1
                        channel_index: 1
                        logprob: -0.156
        '202':
          description: Asynchronous request accepted
          content:
            application/json:
              example:
                message: Request accepted. Transcription result will be sent to the webhook.
                request_id: abc123
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: speech_to_text
      x-fern-sdk-method-name: convert
