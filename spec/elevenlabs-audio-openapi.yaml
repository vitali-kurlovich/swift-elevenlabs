        start:
          anyOf:
          - type: number
          - type: 'null'
          title: Start
          description: The start time of the word or sound in seconds.
        end:
          anyOf:
          - type: number
          - type: 'null'
          title: End
          description: The end time of the word or sound in seconds.
        type:
          type: string
