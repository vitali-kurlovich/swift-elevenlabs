        audio_effects:
          anyOf:
          - $ref: '#/components/schemas/EffectsSpec-Input'
          - type: 'null'
          description: Audio effects applied to the generated audio. Unknown IDs return 404 with `param` naming the field.
            Reverb (`environment_id` with `send_level` above 0) and a non-zero `pan` produce stereo audio and are rejected
            with 400 for `ulaw_*`, `alaw_*`, and `pcm_*` output formats. Effects don't change the cost of the request.
      type: object
      required:
      - text
      title: Body_text_to_speech_stream
    Body_text_to_speech_stream_with_timestamps:
      properties:
        text:
          type: string
          title: Text
          description: The text that will get converted into speech.
          examples:
          - This is a test for the API of ElevenLabs.
        model_id:
          type: string
          title: Model Id
          description: Identifier of the model that will be used, you can query them using GET /v1/models. The model needs
            to have support for text to speech, you can check this using the can_do_text_to_speech property.
          default: eleven_multilingual_v2
        language_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Language Code
          description: Language code (ISO 639-1) used to enforce a language for the model and text normalization. If the model
            does not support the provided language code, it will be ignored. This parameter is not supported for multilingual_v2
            models.
          examples:
          - en
        voice_settings:
          anyOf:
          - $ref: '#/components/schemas/VoiceSettingsResponseModel'
          - type: 'null'
          description: Voice settings overriding stored settings for the given voice. They are applied only on the given request.
        pronunciation_dictionary_locators:
          anyOf:
          - items:
              $ref: '#/components/schemas/PronunciationDictionaryVersionLocatorRequestModel'
            type: array
          - type: 'null'
          title: Pronunciation Dictionary Locators
          description: A list of pronunciation dictionary locators (id, version_id) to be applied to the text. They will be
            applied in order. You may have up to 3 locators per request
          examples:
          - - pronunciation_dictionary_id: test
              version_id: id2
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: If specified, our system will make a best effort to sample deterministically, such that repeated requests
            with the same seed and parameters should return the same result. Determinism is not guaranteed. Must be integer
            between 0 and 4294967295.
          examples:
          - 12345
        previous_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Text
          description: The text that came before the text of the current request. Can be used to improve the speech's continuity
            when concatenating together multiple generations or to influence the speech's continuity in the current generation.
          examples:
          - In the heart of a lush valley surrounded by towering mountains lies the quaint village of Willowbrook.
        next_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Text
          description: The text that comes after the text of the current request. Can be used to improve the speech's continuity
            when concatenating together multiple generations or to influence the speech's continuity in the current generation.
          examples:
          - The Willowbrook Festival, held every spring, celebrates the blossoming of the wild bluebells that carpet the nearby
            forest floors, creating a breathtaking sea of blue under the canopy of fresh green leaves.
        previous_request_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Previous Request Ids
          description: A list of request_id of the samples that were generated before this generation. Can be used to improve
            the speech's continuity when splitting up a large task into multiple requests. The results will be best when the
            same model is used across the generations. In case both previous_text and previous_request_ids is send, previous_text
            will be ignored. A maximum of 3 request_ids can be send.
          examples:
          - - 09bOJkdYVjKy2oOiiVtR
            - 0p2uKqOnZyce22SPZ9d5
            - 1KYvY8WZAKmcjCJ1mvVB
        next_request_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Next Request Ids
          description: A list of request_id of the samples that come after this generation. next_request_ids is especially
            useful for maintaining the speech's continuity when regenerating a sample that has had some audio quality issues.
            For example, if you have generated 3 speech clips, and you want to improve clip 2, passing the request id of clip
            3 as a next_request_id (and that of clip 1 as a previous_request_id) will help maintain natural flow in the combined
            speech. The results will be best when the same model is used across the generations. In case both next_text and
            next_request_ids is send, next_text will be ignored. A maximum of 3 request_ids can be send.
          examples:
          - - 3tPgBrD1UdW3snUkGw1K
            - 4D1jAxiRFkolBNUGzXkU
            - 4c8Z4aWliVR2oipYRXhj
        use_pvc_as_ivc:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Pvc As Ivc
          description: Whether to use the IVC version of a professional voice. This may improve expressiveness and reduce
            latency.
          examples:
          - true
        apply_text_normalization:
          type: string
          enum:
          - auto
          - 'on'
          - 'off'
          title: Apply Text Normalization
          description: 'This parameter controls text normalization with three modes: ''auto'', ''on'', and ''off''. When set
            to ''auto'', the system will automatically decide whether to apply text normalization (e.g., spelling out numbers).
            With ''on'', text normalization will always be applied, while with ''off'', it will be skipped.'
          default: auto
          examples:
          - true
        apply_language_text_normalization:
          type: boolean
          title: Apply Language Text Normalization
          description: 'This parameter controls language text normalization. This helps with proper pronunciation of text
            in some supported languages. WARNING: This parameter can heavily increase the latency of the request. Currently
            only supported for Japanese.'
          default: false
          examples:
          - true
        audio_effects:
          anyOf:
          - $ref: '#/components/schemas/EffectsSpec-Input'
          - type: 'null'
          description: Audio effects applied to the generated audio. Unknown IDs return 404 with `param` naming the field.
            Reverb (`environment_id` with `send_level` above 0) and a non-zero `pan` produce stereo audio and are rejected
            with 400 for `ulaw_*`, `alaw_*`, and `pcm_*` output formats. Effects don't change the cost of the request.
      type: object
      required:
      - text
      title: Body_text_to_speech_stream_with_timestamps
