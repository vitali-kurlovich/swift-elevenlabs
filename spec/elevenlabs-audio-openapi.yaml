          items:
            type: string
            format: binary
          type: array
          maxItems: 10
          minItems: 1
          title: Videos
          description: "\n            One or more video files sent via FormData array (multipart/form-data). They will be\
            \ combined into one codec in order.\n            A maximum of 10 videos is allowed, where the total size of the\
            \ combined video is limited to 200MB.\n            In total, the video can be up to 600 seconds long. Note that\
            \ combining multiple videos may increase the request duration significantly. If possible, combine the videos beforehand.\n\
            \            "
        description:
          anyOf:
          - type: string
            maxLength: 4100
            minLength: 1
          - type: 'null'
          title: Description
          description: Optional text description of the music you want. A maximum of 4100 characters is allowed.
        tags:
          items:
            type: string
          type: array
          maxItems: 10
          minItems: 0
          title: Tags
          description: Optional list of style tags (e.g. ['upbeat', 'cinematic']). A maximum of 10 tags is allowed.
